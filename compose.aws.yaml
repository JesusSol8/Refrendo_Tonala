services:
  web:
    build: .
    restart: always
    env_file: .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/salud/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: always
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config: