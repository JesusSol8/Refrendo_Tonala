services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DEBUG: "0"
      TRUST_PROXY: "1"
      REQUIRE_POSTGRES16: "1"

    expose:
      - "8000"

    networks:
      - refrendo_network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          request = urllib.request.Request(
              'http://127.0.0.1:8000/salud/',
              headers={
                  'Host': 'localhost',
                  'X-Forwarded-Proto': 'https'
              }
          )
          response = urllib.request.urlopen(request, timeout=5)
          assert response.status == 200

      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  proxy:
    image: caddy:2-alpine

    restart: unless-stopped

    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Define PUBLIC_HOST en .env}

    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"

    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - refrendo_network

    depends_on:
      - web

networks:
  refrendo_network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config: