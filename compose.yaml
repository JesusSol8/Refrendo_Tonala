services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: refrendo
      POSTGRES_USER: refrendo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refrendo -d refrendo"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: '1'
      DATABASE_URL: postgres://refrendo:${POSTGRES_PASSWORD}@db:5432/refrendo
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/salud/',headers={'Host':'localhost','X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Define PUBLIC_HOST en .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
volumes:
  postgres_data:
  caddy_data:
  caddy_config:

